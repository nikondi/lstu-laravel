services:

  app:
    container_name: lstu-app
    build:
      context: .
      dockerfile: ./Dockerfile
      target: dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    tty: true
    volumes:
      - ./:/app
    networks:
      - npm-network


  # MariaDB контейнер
  db:
    container_name: lstu-db
    image: mariadb:10.5.21
    restart: unless-stopped
    tty: true
    ports:
      - "${DATABASE_PUBLIC_PORT:-3306}:3306"
    command: [ '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci','--default-authentication-plugin=mysql_native_password' ]
    environment:
      # Желаемые настройки для СУБД MySQL
      MYSQL_DATABASE: lstu
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_USER: 'lstu'
      MYSQL_PASSWORD: 'lstu'
    volumes:
      - dbdata:/var/lib/mysql # Используем именованный том из блока volumes
      - ./.docker/mariadb/my.cnf:/etc/mysql/my.cnf # Передаем в контейнер конфигурационный файл
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping" ]
    networks:
      - npm-network

networks:
  npm-network:
    external: true

volumes:
  # Чтобы данные БД не пропадали после выключения создаем именованный том
  dbdata:
    driver: local
